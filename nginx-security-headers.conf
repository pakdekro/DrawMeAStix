# En-têtes de sécurité, inclus dans chaque bloc `location` de nginx.conf.
#
# Fichier séparé parce que nginx n'hérite pas des `add_header` dès que le bloc
# courant en déclare un : les répéter à la main invitait à en oublier, ce qui
# était déjà arrivé sur /assets/.
#
# `connect-src` mérite un mot. Il autorise tout `https:` parce que le sidecar
# d'enrichissement est choisi par l'analyste : son adresse n'est pas connue au
# moment du build, et la coder ici obligerait chacun à recompiler l'image.
# C'est un compromis assumé, pas un oubli - la CSP borne ici l'exécution de
# code, pas la destination des requêtes. Qui héberge pour une équipe et connaît
# son sidecar a tout intérêt à remplacer `https:` par ce seul domaine.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
