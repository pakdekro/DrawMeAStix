[project]
name = "drawmeastix-stix-core"
version = "0.1.0"
description = "Cœur STIX de Draw Me A STIX - IDs déterministes, bundle I/O, oracle golden (outil de dev/CI)"
requires-python = ">=3.12"
dependencies = [
    "stix2>=3.0",
    "pyyaml>=6.0",  # ATLAS publishes its data as YAML, and only as YAML
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pycti>=6.0",  # uniquement pour le test de non-régression des IDs déterministes
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
