# Configuration nginx de l'app statique Draw Me A STIX.
# En-têtes de sécurité : l'app ingère du JSON non fiable et garde un token
# d'enrichissement en localStorage - une CSP stricte neutralise un XSS futur
# et l'exfiltration.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Répétés dans CHAQUE bloc location, et ce n'est pas une maladresse :
    # nginx n'hérite des `add_header` d'un niveau supérieur QUE si le niveau
    # courant n'en déclare aucun. Le `Cache-Control` du bloc /assets/ suffisait
    # donc à faire disparaître les quatre en-têtes ci-dessous sur la totalité
    # du JS, du CSS et des polices - c'est-à-dire là où `nosniff` sert le plus.
    include /etc/nginx/conf.d/dmas-security-headers.conf;

    # SPA à routeur hash : tout chemin inconnu retombe sur index.html.
    #
    # `$uri/index.html` s'intercale pour /guide, la seule page pré-rendue au
    # build (#223). Sans elle le chemin retombait sur la coquille vide de la
    # SPA, qui n'a pas de route non-hash : un moteur, un aperçu de lien ou un
    # navigateur sans JavaScript n'obtenait rien.
    location / {
        include /etc/nginx/conf.d/dmas-security-headers.conf;
        try_files $uri $uri/index.html /index.html;
    }

    # Assets hashés par Vite : cache long. Un seul `Cache-Control`, et pas
    # `expires` en plus - la directive en émet un de son côté, et la réponse
    # en sortait avec deux valeurs différentes. `immutable` justifie à lui
    # seul de l'écrire à la main : `expires` ne sait pas le produire.
    location /assets/ {
        include /etc/nginx/conf.d/dmas-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
