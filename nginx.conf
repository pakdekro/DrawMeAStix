# Configuration nginx de l'app statique Draw Me A STIX.
# Security headers: the app ingests untrusted JSON and can hold an enrichment
# token in browser storage, so a strict CSP neutralises a future XSS and the
# exfiltration that would follow. Where that token actually lives, and for how
# long, is described in SECURITY.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Repeated in EVERY location block, and that is not clumsiness: nginx
    # inherits `add_header` from an outer level ONLY if the current level
    # declares none of its own. The `Cache-Control` in the /assets/ block was
    # therefore enough to make the headers below vanish from all the JS, CSS
    # and fonts, which is precisely where `nosniff` earns its keep.
    include /etc/nginx/conf.d/dmas-security-headers.conf;

    # Hash-routed SPA: any unknown path falls back to index.html.
    #
    # `$uri/index.html` slips in ahead of that fallback for the pre-rendered
    # prose pages, /guide (#223) and /about (#225). Without it the path landed
    # on the SPA's empty shell, which has no non-hash route: a crawler, a link
    # preview or a browser without JavaScript got nothing at all.
    location / {
        include /etc/nginx/conf.d/dmas-security-headers.conf;
        try_files $uri $uri/index.html /index.html;
    }

    # Vite-hashed assets: long cache. One `Cache-Control` and no `expires`
    # alongside it, because that directive emits one of its own and the
    # response went out carrying two different values. `immutable` alone
    # justifies writing it by hand: `expires` cannot produce it.
    location /assets/ {
        include /etc/nginx/conf.d/dmas-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
