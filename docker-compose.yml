# Both images are built here and published nowhere, so `pull_policy: build`
# is on each of them. Without it, `docker compose pull` reads the `image:`
# name, looks for it on Docker Hub, and fails with "pull access denied for
# drawmeastix, repository does not exist or may require 'docker login'".
#
# `docker compose up` never hit this, which is why it went unnoticed: it
# builds what it cannot pull. Deployment tools do hit it, because they pull
# before they start. The message accuses your credentials, when the image
# simply does not exist anywhere but on the machine that builds it.
services:
  drawmeastix:
    build: .
    image: drawmeastix:latest
    pull_policy: build
    ports:
      - "8000:80"
    restart: unless-stopped
    # No volume: investigations live in each analyst's own browser
    # (IndexedDB). Backing up means exporting the STIX bundle.

  # Passive enrichment sidecar (v3), optional and movable elsewhere.
  # A container of its own because its network posture differs (outbound
  # calls + a token): run it on another host, or not at all - with no
  # endpoint the app is guaranteed offline.
  enricher:
    build: ./enricher
    image: drawmeastix-enricher:latest
    pull_policy: build
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      # Bearer token shared with the app (set it; otherwise one is generated
      # at startup and printed to the logs). In production put the enricher
      # behind an HTTPS reverse proxy: browsers block mixed content (#52).
      - STIXIT_ENRICHER_TOKEN=${ENRICHER_TOKEN:-}
      - STIXIT_ENRICHER_ORIGINS=${ENRICHER_ORIGINS:-http://localhost:8000}
    profiles:
      - enrich
