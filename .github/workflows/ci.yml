# Draw Me A STIX - automated non-regression.
#
# Three independent jobs: the application, the reference STIX core, and the
# enrichment sidecar. The second one regenerates the golden vectors and fails
# if they differ from what is committed: that is what keeps the Python and
# TypeScript implementations of the identifiers from drifting apart. See
# docs/identifiers.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  stix-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: libmagic (required by pycti)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Sync
        working-directory: backend
        run: uv sync
      - name: Lint
        working-directory: backend
        run: uv run ruff check --output-format=github .
      - name: Tests
        working-directory: backend
        run: uv run pytest -q
      - name: Golden vectors up to date?
        working-directory: backend
        run: |
          uv run python scripts/generate_golden_vectors.py
          uv run python scripts/generate_golden_bundle.py
          golden="../frontend/src/stix/golden-vectors.json ../frontend/src/stix/golden-bundle.json"
          if ! git diff --quiet -- $golden; then
            # The diff in the log AND its summary in the annotation: a check
            # that says "out of sync" without saying how forces you to re-run
            # CI blind.
            git diff -- $golden | head -80
            echo "::error::golden vectors out of sync ($(git diff --shortstat -- $golden | tr -d '\n')) - re-run generate_golden_*.py and commit"
            exit 1
          fi

  enricher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync
        working-directory: enricher
        run: uv sync
      - name: Lint
        working-directory: enricher
        run: uv run ruff check --output-format=github .
      - name: Tests
        working-directory: enricher
        run: uv run pytest -q
